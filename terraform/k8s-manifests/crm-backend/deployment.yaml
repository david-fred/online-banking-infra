apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-backend-deployment
  namespace: default
  labels:
    app: crm-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-backend
  template:
    metadata:
      labels:
        app: crm-backend
    spec:
      containers:
      - name: backend-container
        image: node:18-alpine # Placeholder for your MERN Node.js app backend
        command: ["sh", "-c", "echo Backend Running && sleep 3600"]
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "capstone-mysql-db.c123456789.us-east-1.rds.amazonaws.com" # ⚠️ REPLACE with your actual RDS Endpoint from Terraform output
        - name: DB_USER
          value: "admin"
        - name: DB_PASS
          value: "digitalwitch2026"
        - name: DB_NAME
          value: "capstonedb"